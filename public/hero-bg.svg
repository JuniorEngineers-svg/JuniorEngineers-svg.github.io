<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="35%" stop-color="#111c38"/>
      <stop offset="70%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="glowBlue" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0056b3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#4338ca" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="isometricGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>

    <!-- Linear Node Gradient -->
    <linearGradient id="lineGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowPurple)"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#isometricGrid)"/>

  <!-- Architectural System Blueprint Graphic & DFD/UML Flows -->
  <!-- Floating Connected Nodes (Software System Architecture) -->
  <g id="architecture-nodes" opacity="0.75">
    <!-- Connecting circuit / data flow curves -->
    <path d="M 150 200 C 350 150, 450 350, 700 280 S 1050 180, 1250 320 S 1450 250, 1550 400" fill="none" stroke="url(#lineGrad1)" stroke-width="2.5" stroke-dasharray="6,6"/>
    <path d="M 100 500 C 300 420, 500 650, 850 550 S 1200 680, 1500 520" fill="none" stroke="url(#lineGrad1)" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M 400 100 L 400 350 L 700 350 L 700 600 L 1100 600 L 1100 250" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- DFD Data Flow Circles -->
    <g transform="translate(180, 180)">
      <circle cx="0" cy="0" r="44" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-8" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PROCESS 1.0</text>
      <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DFD Engine</text>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    </g>

    <g transform="translate(680, 280)">
      <rect x="-65" y="-35" width="130" height="70" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="-10" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;System&gt;&gt;</text>
      <text x="0" y="12" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UML Model</text>
      <line x1="-50" y1="2" x2="50" y2="2" stroke="rgba(255,255,255,0.15)"/>
    </g>

    <g transform="translate(1250, 320)">
      <circle cx="0" cy="0" r="48" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="-8" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DATABASE</text>
      <text x="0" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SQL / ERD</text>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    </g>

    <g transform="translate(950, 560)">
      <rect x="-70" y="-32" width="140" height="64" rx="12" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="2"/>
      <text x="0" y="-8" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">INTERFACE</text>
      <text x="0" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">UI / UX Core</text>
    </g>

    <g transform="translate(360, 580)">
      <rect x="-75" y="-30" width="150" height="60" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="0" y="-6" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ANALYTICS</text>
      <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">System Analysis</text>
    </g>
  </g>

  <!-- Glowing Code Blocks in Background -->
  <g opacity="0.22" font-family="monospace" font-size="13" fill="#93c5fd">
    <text x="80" y="740">class SoftwareSystem {</text>
    <text x="110" y="765">  private dfdPipeline: DataFlowGraph;</text>
    <text x="110" y="790">  private umlArchitecture: UnifiedModel;</text>
    <text x="110" y="815">  public verifyCyberSecurity(): boolean { return true; }</text>
    <text x="80" y="840">}</text>
  </g>

  <g opacity="0.22" font-family="monospace" font-size="13" fill="#a7f3d0">
    <text x="1160" y="740">SELECT student_engineer, project_status</text>
    <text x="1160" y="765">FROM faculty_cybersecurity_systems</text>
    <text x="1160" y="790">WHERE grade = 'PRODUCTION_READY';</text>
    <text x="1160" y="815">// 100% Quality &amp; Clean Architecture</text>
  </g>

  <!-- Subtle vignette / bottom blend gradient -->
  <rect width="1600" height="900" fill="url(#skyGrad)" opacity="0.25"/>
</svg>
